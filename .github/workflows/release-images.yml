name: Release Docker Images

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag name
        id: get_tag
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Downcase Owner name
        id: downcase_owner
        run: echo "OWNER_LOWER=$(echo '${{ env.OWNER }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # 1. API Service
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.downcase_owner.outputs.OWNER_LOWER }}/hallo-projects-api:latest
            ${{ env.REGISTRY }}/${{ steps.downcase_owner.outputs.OWNER_LOWER }}/hallo-projects-api:${{ steps.get_tag.outputs.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Worker Service
      - name: Build and push Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.downcase_owner.outputs.OWNER_LOWER }}/hallo-projects-worker:latest
            ${{ env.REGISTRY }}/${{ steps.downcase_owner.outputs.OWNER_LOWER }}/hallo-projects-worker:${{ steps.get_tag.outputs.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 3. Web Service
      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.downcase_owner.outputs.OWNER_LOWER }}/hallo-projects-web:latest
            ${{ env.REGISTRY }}/${{ steps.downcase_owner.outputs.OWNER_LOWER }}/hallo-projects-web:${{ steps.get_tag.outputs.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 4. Docs Service
      - name: Build and push Docs image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/docs/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.downcase_owner.outputs.OWNER_LOWER }}/hallo-projects-docs:latest
            ${{ env.REGISTRY }}/${{ steps.downcase_owner.outputs.OWNER_LOWER }}/hallo-projects-docs:${{ steps.get_tag.outputs.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
