name: HalloProjects

services:
  postgres:
    image: postgres:15-alpine
    container_name: HalloProjects-postgres
    environment:
      POSTGRES_DB: hallo_projects
      POSTGRES_USER: hallo
      POSTGRES_PASSWORD: hallo_dev_password
    ports:
      - "5436:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hallo -d hallo_projects"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: HalloProjects-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_dev_data:
  redis_dev_data:
